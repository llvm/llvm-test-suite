# -*- Python -*-
# Configuration for the tests of run-test-suite.py, run with:
#
#   lit utils/lnt/tests

import os
import sys
import tempfile

import lit.formats

config.name = "run-test-suite.py"
config.test_format = lit.formats.ShTest()
config.suffixes = [".py", ".shtest"]
config.excludes = ["Inputs"]

config.test_source_root = os.path.dirname(os.path.abspath(__file__))
config.test_exec_root = os.path.join(tempfile.gettempdir(), "lnt-run-test-suite-tests")

lnt_dir = os.path.dirname(config.test_source_root)
python = '"%s"' % sys.executable
config.substitutions.append(
    ("%{run-test-suite}", '%s "%s"' % (python, os.path.join(lnt_dir, "run-test-suite.py")))
)
# For the tests that import the runner's modules directly.
config.substitutions.append(("%{python}", 'env "PYTHONPATH=%s" %s' % (lnt_dir, python)))
